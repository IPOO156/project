name: CI
on:
  push:
    branches: [ ry ]
  pull_request:
    branches: [ ry ]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Build Vue Project
        run: npm run build

      # 上传dist目录到阿里云OSS
      - name: Upload dist to Aliyun OSS
        uses: aliyun/setup-ossutil@v1
        with:
          endpoint: oss-${{ secrets.OSS_REGION }}.aliyuncs.com
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      - run: ossutil cp -rf dist oss://${{ secrets.OSS_BUCKET }}/ --delete
