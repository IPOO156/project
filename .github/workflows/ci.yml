name: CI
on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Build Vue Project
        run: npm run build

      - name: Upload to Aliyun OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: oss-cn-chengdu.aliyuncs.com
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          wget https://gosspublic.alicdn.com/ossutil/v2.0.0/ossutil-linux-amd64 -O ossutil64
          chmod +x ossutil64
          ./ossutil64 --signature-version ossv4 config -i ${OSS_ACCESS_KEY_ID} -k ${OSS_ACCESS_KEY_SECRET} -e ${OSS_ENDPOINT}
          ./ossutil64 --signature-version ossv4 sync dist/ oss://${OSS_BUCKET}/ --delete --force