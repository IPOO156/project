name: CI

on:
  push:
    branches: [main, new-main, nine]
  pull_request:
    branches: [main, new-main, nine]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Unit test
        run: npm run test:unit

      - name: Build
        run: npm run build

      # npm registry 默认走 npmmirror 时不支持 audit 接口，显式指定官方源
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
