<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 深色标签栏用浅蓝版（#BED8F6）；浅色端保持原 favicon-logo.png 零变化。
         深色 link 在前、无 media 的浅色兜底在后：不识别 media 的浏览器会命中末尾兜底，浅色不受影响；
         识别 media 的浏览器（如 Firefox）在深色下命中上面的深色资源。 -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-dark-32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/favicon-dark-64.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="/favicon-logo.png" />
    <!-- iOS 不识别 apple-touch-icon 上的 media，浅色兜底放最后，保证主屏图标行为不变 -->
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/favicon-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="学生档鉴未来——学生档案信息管理平台，统一管理荣誉成果、成长轨迹与档案资产"
    />
    <!-- 拉丁字体本地化，避免 Google Fonts CDN 阻塞首屏渲染 -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Noto Serif SC 中文全字库过大不本地化，异步加载不阻塞渲染 -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap"
      />
    </noscript>
    <!-- 静态兜底标题：登录页与首屏挂载前显示。登录页学生/教师共用，故不带端标识；
         进入系统后由 DefaultLayout 按 route.meta.teacher 改写为「<页面名> · 学生/教师档鉴未来」 -->
    <title>档鉴未来</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
